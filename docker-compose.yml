services:
  work-grid:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:4173:4173"
    environment:
      LOCAL_DATA_PATH: /data
    volumes:
      - work-grid-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

volumes:
  work-grid-data:
