services:
  work-grid:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:4173:4173"
    environment:
      LOCAL_DATA_PATH: /data
      WORKGRID_BACKUP_PATH: /backups
      WORKGRID_BACKUP_INTERVAL_SECONDS: 86400
      WORKGRID_BACKUP_RETAIN_DAILY: 7
      WORKGRID_BACKUP_RETAIN_WEEKLY: 4
      WORKGRID_BACKUP_MAX_BYTES: 1073741824
    volumes:
      - work-grid-data:/data
      - work-grid-backups:/backups
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

volumes:
  work-grid-data:
  work-grid-backups:
