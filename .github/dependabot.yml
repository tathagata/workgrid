version: 2
updates:
  # Keeps SHA-pinned actions current. The cooldown avoids adopting a release in the first
  # days after publication, which is when compromised versions are usually caught and pulled.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
