name: CLI

on:
  pull_request:
    paths:
      - "cli/**"
      - ".agents/skills/**"
      - ".github/workflows/cli.yml"
      - ".github/workflows/release-cli.yml"
  push:
    branches: [main]
    paths:
      - "cli/**"
      - ".agents/skills/**"
      - ".github/workflows/cli.yml"
      - ".github/workflows/release-cli.yml"

permissions: {}

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ["22.13.0", "24"]
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      # The CLI has zero dependencies, so there is no `npm install` step to compromise.
      - name: Test
        run: npm test

      - name: Verify package contents
        run: npm run pack:check

      - name: Smoke-test the packed CLI
        shell: bash
        run: |
          npm pack --ignore-scripts
          npm install --global --ignore-scripts ./work-distribution-grid-cli-*.tgz
          workgrid --version
          workgrid --help > /dev/null
          HOME="$RUNNER_TEMP/home" USERPROFILE="$RUNNER_TEMP/home" workgrid skill install --agent all --json
